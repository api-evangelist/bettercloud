naftiko: 1.0.0-alpha2
info:
  label: BetterCloud Platform API — Integrations
  description: 'BetterCloud Platform API — Integrations. 1 operations. Lead operation: BetterCloud List Integrations. Self-contained
    Naftiko capability covering one Bettercloud business surface.'
  tags:
  - Bettercloud
  - Integrations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BETTERCLOUD_API_KEY: BETTERCLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-integrations
    baseUri: https://api.bettercloud.com/v1
    description: BetterCloud Platform API — Integrations business capability. Self-contained, no shared references.
    resources:
    - name: integrations
      path: /integrations
      operations:
      - name: listintegrations
        method: GET
        description: BetterCloud List Integrations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.BETTERCLOUD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: platform-integrations-rest
    port: 8080
    description: REST adapter for BetterCloud Platform API — Integrations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/integrations
      name: integrations
      description: REST surface for integrations.
      operations:
      - method: GET
        name: listintegrations
        description: BetterCloud List Integrations
        call: platform-integrations.listintegrations
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-integrations-mcp
    port: 9090
    transport: http
    description: MCP adapter for BetterCloud Platform API — Integrations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: bettercloud-list-integrations
      description: BetterCloud List Integrations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-integrations.listintegrations
      outputParameters:
      - type: object
        mapping: $.
