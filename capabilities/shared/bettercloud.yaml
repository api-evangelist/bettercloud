naftiko: "1.0.0-alpha1"

info:
  label: BetterCloud Platform API
  description: >-
    BetterCloud SaaS management platform API for users, groups, workflows,
    integrations, and audit events.
  tags:
    - BetterCloud
    - Saas Management
    - User Lifecycle
    - Automation
    - Security
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      BETTERCLOUD_API_KEY: BETTERCLOUD_API_KEY

capability:
  consumes:
    - type: http
      namespace: bettercloud
      baseUri: https://api.bettercloud.com/v1
      description: BetterCloud Platform API
      authentication:
        type: apikey
        key: X-API-Key
        value: "{{BETTERCLOUD_API_KEY}}"
        placement: header
      resources:
        - name: users
          path: /users
          description: SaaS user management
          operations:
            - name: list-users
              method: GET
              description: List all users
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: Page number
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Filter by status
                - name: email
                  in: query
                  type: string
                  required: false
                  description: Filter by email
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-user
              method: GET
              description: Get a user by ID
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: User ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-user
              method: PATCH
              description: Update user attributes
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: User ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  department: "{{tools.department}}"
                  title: "{{tools.title}}"
            - name: suspend-user
              method: POST
              description: Suspend a user
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: User ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: deprovision-user
              method: POST
              description: Deprovision a user
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: User ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: groups
          path: /groups
          description: Group management
          operations:
            - name: list-groups
              method: GET
              description: List all groups
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-group
              method: POST
              description: Create a new group
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
            - name: get-group
              method: GET
              description: Get a group by ID
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Group ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-group
              method: DELETE
              description: Delete a group
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Group ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-group-members
              method: GET
              description: List members of a group
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Group ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: add-group-member
              method: POST
              description: Add a user to a group
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Group ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  user_id: "{{tools.user_id}}"
        - name: workflows
          path: /workflows
          description: Automation workflows
          operations:
            - name: list-workflows
              method: GET
              description: List all workflows
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-workflow
              method: POST
              description: Create a new workflow
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  trigger_type: "{{tools.trigger_type}}"
            - name: get-workflow
              method: GET
              description: Get a workflow by ID
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Workflow ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: run-workflow
              method: POST
              description: Trigger a workflow execution
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: Workflow ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  user_ids: "{{tools.user_ids}}"
        - name: events
          path: /events
          description: Audit events and activity logs
          operations:
            - name: list-events
              method: GET
              description: List audit events
              inputParameters:
                - name: from
                  in: query
                  type: string
                  required: false
                  description: Start date
                - name: to
                  in: query
                  type: string
                  required: false
                  description: End date
                - name: type
                  in: query
                  type: string
                  required: false
                  description: Event type filter
                - name: user_id
                  in: query
                  type: string
                  required: false
                  description: Filter by user ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: integrations
          path: /integrations
          description: SaaS application integrations
          operations:
            - name: list-integrations
              method: GET
              description: List all configured integrations
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: bettercloud-rest
      resources:
        - path: /v1/users
          name: users
          description: User management
          operations:
            - method: GET
              name: list-users
              description: List users
              call: "bettercloud.list-users"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/workflows
          name: workflows
          description: Workflow management
          operations:
            - method: GET
              name: list-workflows
              description: List workflows
              call: "bettercloud.list-workflows"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: bettercloud-mcp
      transport: http
      description: MCP server for AI-assisted BetterCloud SaaS management
      tools:
        - name: list-users
          description: List all users across SaaS applications
          hints:
            readOnly: true
            openWorld: true
          call: "bettercloud.list-users"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-user
          description: Get details for a specific user
          hints:
            readOnly: true
          call: "bettercloud.get-user"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: suspend-user
          description: Suspend a user across all SaaS applications
          hints:
            readOnly: false
            destructive: false
          call: "bettercloud.suspend-user"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: deprovision-user
          description: Deprovision a user removing all SaaS access
          hints:
            readOnly: false
            destructive: true
          call: "bettercloud.deprovision-user"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-workflows
          description: List all automation workflows
          hints:
            readOnly: true
          call: "bettercloud.list-workflows"
          outputParameters:
            - type: object
              mapping: "$."
        - name: run-workflow
          description: Trigger a workflow for specific users
          hints:
            readOnly: false
            destructive: false
          call: "bettercloud.run-workflow"
          with:
            id: "tools.id"
            user_ids: "tools.user_ids"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-events
          description: List audit events for compliance and investigation
          hints:
            readOnly: true
          call: "bettercloud.list-events"
          outputParameters:
            - type: object
              mapping: "$."
